<style id="css">
/* VOICE: công cụ làm việc gọn, rõ cho người dạy học tự vận hành livestream
   IDEA: bàn điều khiển đồ họa phát sóng: form bên trái, màn hình chương trình bên phải
   PICTURE: bản xem trước overlay 1920×1080 thật, nền ô cờ để thấy vùng trong suốt
   COLOUR/TYPE: xanh ASTA #1690F8 + navy #0A2A5C trên trắng; Be Vietnam Pro, Barlow Condensed cho nhãn lớn
   LAYOUT: thanh công cụ trên, cột form 400px, vùng xem trước co giãn */
:root{--blue:#1690F8;--navy:#0A2A5C;--line:#D5E3F5;--soft:#F3F8FE;--ink:#0A2A5C;--mut:#5B6F8C}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:#EAF1FA}
body.obs{background:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{margin:0 auto 0 0;font:800 22px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.3px}
.top h1 small{display:block;font:500 13px/1.4 'Be Vietnam Pro',sans-serif;color:var(--mut);letter-spacing:0}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9CCBFF;outline-offset:1px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#0B6FD6}
.btn svg{width:18px;height:18px;flex:none}
.status{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:#2DBE6C;display:inline-block}
.status.dirty i{background:#F0A020}
.main{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;padding:20px;align-items:start}
.form{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f:last-child{margin-bottom:0}
.f label{font-size:13px;font-weight:600;color:var(--mut)}
.f input,.f textarea,.f select{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:16px}
.f textarea{resize:vertical;min-height:70px;line-height:1.4}
.hint{font-size:12.5px;color:var(--mut);margin:0}
.warn{font-size:12.5px;color:#B36A00;margin:4px 0 0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lk{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--soft)}
.lk-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lk-h .ico{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.lk-h select{flex:1;min-height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 8px;font-size:14px}
.ib{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ib:hover{border-color:var(--blue);color:var(--blue)}
.ib.del:hover{border-color:#E04848;color:#E04848}
.ib svg{width:16px;height:16px}
.lk input{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px;margin-top:6px}
.lk input[type=file]{padding:6px;font-size:13px}
.add{width:100%;justify-content:center;border-style:dashed}
.sw{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:12px}
.sw input{width:20px;height:20px;accent-color:var(--blue)}
.pv{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
.pv-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.pv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pv-head b{font-size:15px}
.pv-head span{font-size:13px;color:var(--mut)}
.stage-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:repeating-conic-gradient(#D9DFE8 0 25%,#F4F6FA 0 50%) 0 0/24px 24px}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.help{font-size:14px}
.help ol{margin:6px 0 0;padding-left:20px}
.help li{margin:4px 0}
.help code{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.full{position:fixed;inset:0;z-index:20;background:repeating-conic-gradient(#D9DFE8 0 25%,#F4F6FA 0 50%) 0 0/24px 24px;display:flex;align-items:center;justify-content:center}
.full .x{position:fixed;top:14px;right:14px;z-index:21}
@media(max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}.pv{position:static;order:-1}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

function fit(root) {
  const notes = [];
  root.querySelectorAll('[data-fit]').forEach(el => {
    const [max, min] = el.dataset.fit.split('/').map(Number);
    let f = max; el.style.fontSize = f + 'px';
    while (el.scrollWidth > el.clientWidth + 0.5 && f > min) { f -= 1; el.style.fontSize = f + 'px'; }
    if (el.scrollWidth > el.clientWidth + 0.5) notes.push(`${el.dataset.name}: quá dài, đã thu nhỏ hết mức mà vẫn bị cắt — nên rút ngắn.`);
    else if (f < max) notes.push(`${el.dataset.name}: tự thu nhỏ chữ từ ${max}px xuống ${f}px cho vừa khung.`);
  });
  return notes;
}

          <select data-f="icon" aria-label="Icon liên kết ${i + 1}">${ICON_OPTS.map(([v, t]) => `<option value="${v}"${(l.icon || 'auto') === v ? ' selected' : ''}>${t}</option>`).join('')}</select>
          <button class="ib" data-a="up" title="Lên" aria-label="Đưa lên"${i ? '' : ' disabled'}>${IC.up}</button>
          <button class="ib" data-a="down" title="Xuống" aria-label="Đưa xuống"${i < cfg.links.length - 1 ? '' : ' disabled'}>${IC.down}</button>
          <button class="ib del" data-a="del" title="Xoá" aria-label="Xoá liên kết">${IC.x}</button>
        </div>
        <input data-f="text" value="${esc(l.text)}" placeholder="Chữ hiển thị, vd: @astravirtus_ed" aria-label="Chữ hiển thị">
        <input data-f="url" value="${esc(l.url)}" placeholder="Đường dẫn, vd: https://www.tiktok.com/@..." aria-label="Đường dẫn">
        ${(l.icon === 'upload') ? `<input type="file" data-f="img" accept="image/*" aria-label="Tải ảnh icon">` : ''}
      </div>`).join('') || '<p class="hint">Chưa có liên kết nào.</p>';
    $('#b-add').disabled = cfg.links.length >= 8;
    $('#b-add').title = cfg.links.length >= 8 ? 'Tối đa 8 liên kết để chữ còn đọc được' : '';
  }
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.k) { cfg[el.dataset.k] = el.value; }
    else if (el.id === 'i-wm') { cfg.wmOn = el.checked; }
    else if (el.dataset.f === 'text' || el.dataset.f === 'url') {
      const i = +el.closest('.lk').dataset.i; cfg.links[i][el.dataset.f] = el.value;
      const ico = el.closest('.lk').querySelector('.ico'); ico.innerHTML = iconHTML(cfg.links[i], 32);
    } else return;
    persist(); render();
  });
  document.addEventListener('change', e => {
    const el = e.target, box = el.closest && el.closest('.lk'); if (!box) return;
    const i = +box.dataset.i;
    if (el.dataset.f === 'icon') { cfg.links[i].icon = el.value; links(); persist(); render(); }
    if (el.dataset.f === 'img' && el.files[0]) {
      const fr = new FileReader();
      fr.onload = () => { const im = new Image(); im.onload = () => {
        const S = 96, cv = document.createElement('canvas'); cv.width = cv.height = S;
        const r = Math.min(S / im.width, S / im.height), w = im.width * r, h = im.height * r;
        cv.getContext('2d').drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
        cfg.links[i].img = cv.toDataURL('image/png'); links(); persist(); render();
      }; im.src = fr.result; };
      fr.readAsDataURL(el.files[0]);
    }
  });
  $('#lk').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const i = +b.closest('.lk').dataset.i, L = cfg.links;
    if (b.dataset.a === 'del') L.splice(i, 1);
    if (b.dataset.a === 'up' && i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]];
    if (b.dataset.a === 'down' && i < L.length - 1) [L[i + 1], L[i]] = [L[i], L[i + 1]];
    links(); persist(); render();
  });
  $('#b-add').onclick = () => { if (cfg.links.length >= 8) return; cfg.links.push({ icon: 'auto', text: '', url: '', img: '' }); links(); persist(); render(); const ins = $('#lk').querySelectorAll('.lk:last-child input'); ins[0] && ins[0].focus(); };

  const buildHTML = () => {
    const head = document.head.innerHTML.replace(/<style id="css">[\s\S]*?<\/style>/, '').trim();
    const json = JSON.stringify(cfg, null, 1).replace(/</g, '\\u003c');
    const S = '<' + '/script>';
    return `<!DOCTYPE html>\n<html lang="vi">\n<head>\n${head}\n<style id="css">${$('#css').textContent}</style>\n</head>\n<body>\n<script id="cfg" type="application/json">${json}${S}\n<script id="app">${$('#app').textContent}${S}\n</body>\n</html>\n`;
  };
  const download = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };

  const slug = s => (s || 'overlay').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 50);
  $('#b-png').onclick = async () => {
    const btn = $('#b-png'); if (btn.disabled) return; btn.disabled = true;
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-30000px;top:0;width:1920px;height:1080px;pointer-events:none';
    try {
      host.innerHTML = overlay(cfg); document.body.appendChild(host);
      if (document.fonts) await document.fonts.ready;
      fit(host);
      const xhtml = new XMLSerializer().serializeToString(host.firstElementChild);
      const svgText = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><foreignObject x="0" y="0" width="1920" height="1080"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1920px;height:1080px;margin:0"><style>${$('#fonts').textContent}</style>${xhtml}</div></foreignObject></svg>`;
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
      await img.decode(); await new Promise(r => setTimeout(r, 150));
      const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080;
      cv.getContext('2d').drawImage(img, 0, 0);
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ASTA-overlay-${slug(cfg.topic)}.png`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
      toast('Đã tải ảnh PNG 1920×1080 (trong suốt ở vùng bài giảng, webcam và ô chữ chạy)');
    } catch (e) { toast('Không xuất được ảnh: ' + (e && e.message || e)); }
    finally { host.remove(); btn.disabled = false; }
  };
  $('#b-full').onclick = () => {
    document.body.insertAdjacentHTML('beforeend', `<div class="full" id="full"><button class="btn x" id="b-x">${IC.x}Đóng (Esc)</button><div id="full-stage" style="width:1920px;height:1080px;flex:none;transform-origin:center"></div></div>`);
    const fs = $('#full-stage'); fs.innerHTML = overlay(cfg); fit(fs);
    const sc = () => { fs.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }; sc(); addEventListener('resize', sc);
    const close = () => { const f = $('#full'); f && f.remove(); removeEventListener('resize', sc); removeEventListener('keydown', esck); };
    const esck = e => { if (e.key === 'Escape') close(); };
    addEventListener('keydown', esck); $('#b-x').onclick = close;
  };
  fillForm(); status(); render();
  if (document.fonts) document.fonts.ready.then(render);
}
}
</script>
</body>
</html>
